<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <script src="https://code.jquery.com/jquery-3.6.0.js" crossorigin="anonymous"></script>
  </head>
  <body id="body">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
  
  <!-- 조건부 스크립트 로딩 -->
  <script>
    function loadTailwindCSS() {
        // 온라인 상태인지 확인
        if (navigator.onLine) {
          const timeoutMs = 1000;
            const controller = new AbortController();
            const { signal } = controller;

            // timeout 설정
            const timeoutId = setTimeout(() => {
                controller.abort();
            }, timeoutMs);

            // 실제로 unpkg에 접근 가능한지 추가 확인
            fetch('https://unpkg.com/@tailwindcss/browser@4', { method: 'HEAD', mode: 'no-cors', signal})
                .then(() => {
                  clearTimeout(timeoutId);
                  // 접근 가능하면 CDN에서 스크립트 로드
                  const script = document.createElement('script');
                  script.src = 'https://unpkg.com/@tailwindcss/browser@4';
                  document.head.appendChild(script);
                  console.log('CDN에서 Tailwind CSS를 로드했습니다.');
                })
                .catch(() => {
                  clearTimeout(timeoutId);
                    // 접근 불가능하면 로컬 스크립트 로드
                    loadLocalTailwind();
                });
        } else {
            // 오프라인 상태면 로컬 스크립트 로드
            loadLocalTailwind();
        }
    }

    function loadLocalTailwind() {
        const script = document.createElement('script');
        // %PUBLIC_URL%는 빌드 시 실제 경로로 대체됩니다
        script.src = "%PUBLIC_URL%/tailwindcss.js";
        document.head.appendChild(script);
        console.log('로컬에서 Tailwind CSS를 로드했습니다.');
    }

    // 페이지 로딩 시 실행
    loadTailwindCSS();
  </script>
</html>
